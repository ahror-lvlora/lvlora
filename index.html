<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LVLORA — Life Progress System</title>
<meta name="description" content="LVLORA turns everyday goals into tasks, progress, skills and achievements.">
<meta name="theme-color" content="#040913">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
[hidden]{display:none!important}img{max-width:100%}
/* Layout: sticky HUD strip on top, window nav (sidebar on desktop, bottom bar on phones), one translucent system window at a time in the stage.
   Single deliberate look: dark game UI, so no light theme. Skins bought in the shop override the glow tokens at runtime. */
:root{
  color-scheme:dark;
  --bg:#040913; --tint:8,22,50;
  --glow:#38a9ff; --glow-2:#9fdcff; --glow-rgb:56,169,255;
  --ink:#dcebfb; --ink-dim:#8aa6c6; --ink-faint:#4f6a8a;
  --gold:#f4c95d; --gold-rgb:244,201,93; --violet:#ab8cff; --violet-rgb:171,140,255;
  --ok:#45e0a8; --bad:#ff6e86;
  --line:rgba(var(--glow-rgb),.5); --line-soft:rgba(var(--glow-rgb),.22);
  --panel:rgba(var(--tint),.8); --hud-bg:rgba(var(--tint),.95);
  --clip:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
  --f-disp:'Chakra Petch',system-ui,sans-serif; --f-body:'Barlow',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.55 var(--f-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hud-bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(900px 520px at 85% -8%,rgba(var(--glow-rgb),.16),transparent 62%),
   radial-gradient(800px 480px at -8% 108%,rgba(var(--glow-rgb),.09),transparent 62%),
   linear-gradient(rgba(var(--glow-rgb),.045) 1px,transparent 1px) 0 0/46px 46px,
   linear-gradient(90deg,rgba(var(--glow-rgb),.045) 1px,transparent 1px) 0 0/46px 46px}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance}
:focus-visible{outline:2px solid var(--glow-2);outline-offset:2px}
.mono{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-dim)}
.xs{font-size:12.5px}
.eyebrow{font:600 11px/1.3 var(--f-disp);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim)}
.app{max-width:1100px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-block:10px;background:var(--hud-bg);box-shadow:0 0 0 100vmax var(--hud-bg),0 1px 0 100vmax var(--line-soft);clip-path:inset(0 -100vmax -1px -100vmax)}

.hud-in{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) auto;align-items:center;gap:8px 18px}
.hud-id{display:flex;align-items:center;gap:10px;min-width:0;order:1}
.hud-name{display:grid;min-width:0;line-height:1.25}
.hud-name b{font:600 15px var(--f-disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-name span{font-size:12px;color:var(--glow-2);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:42px;height:42px;flex:none;display:grid;place-items:center;clip-path:var(--clip);background:linear-gradient(160deg,rgba(var(--glow-rgb),.7),#071530)}
.mini img{width:100%;height:100%;object-fit:cover}
.mini b{font:700 17px var(--f-disp);color:#fff}
.hud-lvl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;order:2}
.hud-lvl .lv{font-weight:700;color:var(--glow-2);text-shadow:0 0 12px rgba(var(--glow-rgb),.8)}
.hud-lvl .xp{font-size:12px;color:var(--ink-dim)}
.hud-chips{display:flex;gap:8px;order:3}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 12px;border:1px solid var(--line-soft);background:rgba(3,10,24,.6);cursor:pointer;font:600 14px var(--f-disp)}
.chip:hover{border-color:var(--line)}
.chip small{font-size:10px;letter-spacing:.14em;color:var(--ink-dim)}
.chip.gold b{color:var(--gold)} .chip.vio b{color:var(--violet)}
.sound-chip{min-width:54px;justify-content:center;padding-inline:9px}.sound-chip span{font-size:18px;line-height:1;color:var(--glow-2)}.sound-chip small{font-size:9px}
.coin{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 35%,#fff3c4,var(--gold) 65%);box-shadow:0 0 8px rgba(var(--gold-rgb),.7);display:inline-block;flex:none}
.gem{width:10px;height:10px;transform:rotate(45deg);background:var(--violet);box-shadow:0 0 8px rgba(var(--violet-rgb),.8);display:inline-block;flex:none}
.bar{height:8px;background:rgba(var(--glow-rgb),.12);border:1px solid var(--line-soft);position:relative;min-width:0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,rgba(var(--glow-rgb),.55),var(--glow-2));box-shadow:0 0 12px rgba(var(--glow-rgb),.8);transition:width .5s ease}
.bar.tall{height:10px} .bar.gold>i{background:linear-gradient(90deg,#b8902f,var(--gold));box-shadow:0 0 12px rgba(var(--gold-rgb),.6)}
@media (max-width:640px){
  .hud-in{grid-template-columns:minmax(0,1fr) auto}
  .hud-lvl{grid-column:1/-1;order:3}
}

/* shell + nav */
.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:0;padding-block:24px 104px}
.nav{display:grid;gap:6px}
.nav-b{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:transparent;border:1px solid transparent;color:var(--ink-dim);font:600 12px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-align:left}
.nav-b svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-b:hover{color:var(--ink)}
.nav-b.on{color:var(--glow-2);border-color:var(--line);background:rgba(var(--glow-rgb),.1);box-shadow:0 0 18px -6px rgba(var(--glow-rgb),.9)}
.nav-b .short{display:none}
@media (min-width:860px){
  .shell{grid-template-columns:190px minmax(0,1fr);gap:30px;padding-block:28px 56px}
  .nav{align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);align-self:start}
}
@media (max-width:859px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
    background:var(--hud-bg);border-top:1px solid var(--line)}
  .nav-b{flex-direction:column;justify-content:center;gap:3px;padding:8px 2px;font-size:10px;letter-spacing:.06em;text-align:center}
  .nav-b .long{display:none} .nav-b .short{display:block}
}

/* system window */
.stage{min-width:0}
.win{position:relative;margin-top:14px;padding:32px 22px 22px;background:var(--panel);border:1px solid var(--line);
  box-shadow:0 0 0 1px rgba(var(--glow-rgb),.06),0 0 44px -12px rgba(var(--glow-rgb),.45),inset 0 0 70px -34px rgba(var(--glow-rgb),.5);backdrop-filter:blur(6px)}
.win::before{content:"";position:absolute;inset:4px;border:1px solid rgba(var(--glow-rgb),.2);pointer-events:none}
.win::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(var(--glow-rgb),.9),transparent);opacity:0;pointer-events:none}
.win.fresh{animation:open .38s cubic-bezier(.2,.7,.2,1) both}
.win.fresh::after{animation:sweep .9s ease-out .1s}
@keyframes open{from{opacity:.35;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sweep{from{top:0;opacity:.9}to{top:100%;opacity:0}}
.win-title{position:absolute;left:50%;top:0;transform:translate(-50%,-50%);padding:3px 20px;background:var(--bg);border:1px solid var(--glow);color:var(--glow-2);
  font:600 12px/1.5 var(--f-disp);letter-spacing:.3em;text-transform:uppercase;white-space:nowrap;text-shadow:0 0 10px rgba(var(--glow-rgb),.85);box-shadow:0 0 14px rgba(var(--glow-rgb),.4)}
@media (max-width:520px){.win{padding:30px 14px 18px}}
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
.sec-h h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--glow-2)}
.sub{border:1px solid var(--line-soft);background:rgba(3,10,24,.5);padding:14px 16px;display:grid;gap:10px}
.sec-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;font:600 10.5px/1.5 var(--f-disp);letter-spacing:.14em;padding:1px 8px;border:1px solid var(--line-soft);color:var(--ink-dim);text-transform:uppercase;white-space:nowrap}
.tag.exp{color:var(--glow-2);border-color:var(--line)} .tag.gold{color:var(--gold);border-color:rgba(var(--gold-rgb),.5)} .tag.ok{color:var(--ok);border-color:rgba(69,224,168,.5)}

/* buttons + fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid var(--glow);background:rgba(var(--glow-rgb),.1);color:var(--glow-2);
  font:600 12px var(--f-disp);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn:hover:not([disabled]){background:rgba(var(--glow-rgb),.24);box-shadow:0 0 16px rgba(var(--glow-rgb),.5)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:34px;padding:5px 11px;font-size:11px}
.btn.ghost{border-color:var(--line-soft);background:transparent;color:var(--ink-dim)}
.btn.gold{border-color:var(--gold);background:rgba(var(--gold-rgb),.1);color:var(--gold)}
.btn.gold:hover:not([disabled]){background:rgba(var(--gold-rgb),.22);box-shadow:0 0 16px rgba(var(--gold-rgb),.5)}
.btn.vio{border-color:var(--violet);background:rgba(var(--violet-rgb),.1);color:var(--violet)}
.btn.vio:hover:not([disabled]){background:rgba(var(--violet-rgb),.22);box-shadow:0 0 16px rgba(var(--violet-rgb),.5)}
.btn.bad{border-color:var(--bad);background:rgba(255,110,134,.1);color:var(--bad)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,textarea,select{font:inherit;color:var(--ink);background:rgba(3,10,24,.75);border:1px solid var(--line-soft);padding:9px 10px;width:100%;min-width:0;border-radius:0}
textarea{resize:vertical;min-height:64px}
input[type=file]{display:none}
.fld{display:grid;gap:6px;min-width:0}

/* status */
.st-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:520px){.st-top{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.av{position:relative;width:132px;height:132px;display:grid;place-items:center;flex:none}
.av-ring,.av-hex{position:absolute;clip-path:var(--clip)}
.av-ring{inset:10px;background:var(--glow);filter:drop-shadow(0 0 8px rgba(var(--glow-rgb),.9))}
.av-hex{inset:13px;background:linear-gradient(160deg,rgba(var(--glow-rgb),.5),#071530 70%);display:grid;place-items:center;overflow:hidden}
.av-hex img{width:100%;height:100%;object-fit:cover}
.av-hex b{font:700 40px var(--f-disp);color:#fff;text-shadow:0 0 18px rgba(var(--glow-rgb),.95)}
.av.sm{width:76px;height:76px} .av.sm .av-hex b{font-size:22px}
.av::before,.av::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.aura-pulse::before,.aura-pulse::after{inset:2px;border:1.5px solid rgba(var(--glow-rgb),.8);animation:pulse 2.6s ease-out infinite}
.aura-pulse::after{animation-delay:1.3s}
@keyframes pulse{from{transform:scale(.7);opacity:.95}to{transform:scale(1.04);opacity:0}}
.aura-orbit::before{inset:0;border:2px dashed rgba(var(--glow-rgb),.85);animation:spin 14s linear infinite}
.aura-orbit::after{inset:6px;border:1px solid rgba(var(--glow-rgb),.35)}
.aura-storm::before{inset:0;border:2px solid transparent;border-top-color:var(--glow-2);border-bottom-color:var(--glow);animation:spin 2.2s linear infinite;filter:drop-shadow(0 0 6px var(--glow))}
.aura-storm::after{inset:6px;border:2px solid transparent;border-left-color:var(--violet);border-right-color:var(--glow-2);animation:spin 3.4s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.av-btn{background:none;border:0;padding:0;cursor:pointer;display:block}
.name{font-size:28px;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.titlechip{display:inline-block;margin-top:6px;font:600 12px var(--f-disp);letter-spacing:.16em;text-transform:uppercase;color:var(--glow-2);padding:2px 10px;border:1px solid var(--line)}
.lvbig{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.lvbig span{font:600 12px var(--f-disp);letter-spacing:.3em;color:var(--ink-dim)}
.lvbig b{font:700 58px/1 var(--f-disp);color:var(--glow-2);text-shadow:0 0 26px rgba(var(--glow-rgb),.85)}
@media (max-width:520px){.lvbig{justify-content:center}}
.attr-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:26px;align-items:center}
@media (max-width:700px){.attr-wrap{grid-template-columns:minmax(0,1fr)}}
.attrs{display:grid;gap:16px}
.attr-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.attr-h b{font:600 14px var(--f-disp);letter-spacing:.16em}
.attr-h small{color:var(--ink-dim);font-size:12.5px;margin-left:8px}
.attr-v{font-size:22px;font-weight:700;color:var(--glow-2);white-space:nowrap}
.attr-v small{font-size:12px;color:var(--ok);margin-left:4px}
.radar{width:100%;max-width:260px;height:auto;justify-self:center}
.rg{fill:none;stroke:var(--line-soft);stroke-width:1}
.rp{fill:rgba(var(--glow-rgb),.28);stroke:var(--glow);stroke-width:1.6}
.rd{fill:var(--glow-2)}
.rl{fill:var(--ink-dim);font:600 9px var(--f-disp);letter-spacing:.14em}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-soft)}
.stat{padding:12px 14px;border-right:1px solid var(--line-soft);display:grid;gap:2px;min-width:0}
.stat:last-child{border-right:0}
.stat b{font:700 24px/1.2 var(--f-disp);color:var(--ink)}
.stat b small{font-size:12px;color:var(--ink-dim);margin-left:4px;font-weight:600}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}

/* quest */
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stepper .btn{min-width:42px;padding-inline:10px}
.stepper .mid{text-align:center;min-width:0}
.stepper h2{font-size:19px}
.sum{display:grid;gap:10px;margin-top:16px}
.sum-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tl{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line-soft)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:13px 2px;border-bottom:1px solid var(--line-soft)}
.tm{display:grid;font:600 13px/1.25 var(--f-disp);letter-spacing:.03em}
.tm span{color:var(--ink-faint);font-weight:500}
.row h3{font-size:15.5px}
.row p{margin-top:3px;color:var(--ink-dim);font-size:13.5px}
.row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.row.rest{opacity:.62}
.row.done h3{color:var(--glow-2)}
.chk{width:32px;height:32px;display:grid;place-items:center;border:1.5px solid var(--line);background:transparent;color:transparent;cursor:pointer;padding:0}
.chk[aria-checked=true]{background:rgba(var(--glow-rgb),.25);border-color:var(--glow-2);color:var(--glow-2);box-shadow:0 0 14px rgba(var(--glow-rgb),.6)}
.chk[disabled]{opacity:.35;cursor:not-allowed}
.rm{width:32px;height:32px;display:grid;place-items:center;background:transparent;border:1px solid rgba(255,110,134,.5);color:var(--bad);cursor:pointer;padding:0;font-size:18px;line-height:1}
.add{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:14px}
.add .w2{grid-column:span 2} .add .w3{grid-column:span 3} .add .w6{grid-column:1/-1}
@media (max-width:620px){.add{grid-template-columns:repeat(2,minmax(0,1fr))}.add .w2,.add .w3{grid-column:span 1}.add .w6{grid-column:1/-1}}
.rules{margin:0;padding-left:18px;color:var(--ink-dim);display:grid;gap:4px;font-size:14px}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.notes{grid-template-columns:minmax(0,1fr)}}

/* exp + skills */
.lv-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.lv-head .big{font:700 52px/1 var(--f-disp);color:var(--glow-2);text-shadow:0 0 22px rgba(var(--glow-rgb),.8)}
.lv-head .big small{display:block;font-size:11px;letter-spacing:.3em;color:var(--ink-dim);font-weight:600;text-shadow:none;margin-bottom:4px}
.spbox{display:inline-flex;align-items:center;gap:10px;margin-top:10px;padding:6px 12px;border:1px solid var(--violet);color:var(--violet);font:600 13px var(--f-disp);letter-spacing:.12em}
.wk-wrap{position:relative;margin-top:22px;padding-right:38px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-plot{position:relative;height:130px;border-bottom:1px solid var(--line)}
.wk-bar{position:absolute;left:20%;right:20%;bottom:0;min-height:2px;background:linear-gradient(0deg,rgba(var(--glow-rgb),.3),var(--glow));box-shadow:0 0 14px rgba(var(--glow-rgb),.5)}
.wk-plot.today .wk-bar{background:linear-gradient(0deg,rgba(var(--glow-rgb),.5),var(--glow-2))}
.wk-val{position:absolute;left:-4px;right:-4px;text-align:center;font:600 11px var(--f-disp);color:var(--ink)}
.wk-lab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:6px;text-align:center;font:600 11px var(--f-disp);letter-spacing:.08em;color:var(--ink-dim)}
.wk-lab .t{color:var(--glow-2)}
.wk-line{position:absolute;left:0;right:38px;border-top:1px dashed rgba(var(--glow-rgb),.4);pointer-events:none}
.wk-line span{position:absolute;left:100%;margin-left:6px;top:-8px;font:600 10px var(--f-disp);letter-spacing:.06em;color:var(--ink-dim);white-space:nowrap}
.review{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line-soft);margin-top:16px}
.review .stat b{font-size:20px}
@media (max-width:640px){.review{grid-template-columns:repeat(2,minmax(0,1fr))}.review .stat:nth-child(2){border-right:0}.review .stat:nth-child(-n+2){border-bottom:1px solid var(--line-soft)}}
.trees{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.trees{grid-template-columns:minmax(0,1fr)}}
.grp{border:1px solid var(--line-soft);background:rgba(3,10,24,.45);padding:14px 14px 4px;min-width:0}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.grp-h b{font:600 14px var(--f-disp);letter-spacing:.18em}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-soft)}
.skill b{font:600 14.5px var(--f-disp);letter-spacing:.04em}
.skill small{display:block;color:var(--ink-dim);font-size:12.5px}
.pips{display:flex;gap:4px;margin-top:6px}
.pip{width:16px;height:7px;border:1px solid var(--line)}

function scoreBase(a){
 const groups={char:[0,1,2,3,4],mind:[5,6,7,8,9],body:[10,11,12,13,14],social:[15,16,17,18,19]};
 const b={};
 Object.entries(groups).forEach(([key,idx])=>{const penalty=idx.reduce((sum,i)=>sum+(Number(a[i])||0),0);b[key]=Math.max(40,Math.min(92,95+penalty));});
 return b;
}
function shuffleList(list){
 const a=list.slice();
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function makeQuizOrders(){
 /* Eng kam jarimali (0-ball) javoblar A/B/C/D o'rinlariga aynan 5 martadan tushadi. */
 const bestSlots=shuffleList(Array.from({length:20},(_,i)=>i%4));
 return QS.uz.map((q,i)=>{
  const order=[null,null,null,null];order[bestSlots[i]]=0;
  const others=shuffleList([1,2,3]);let n=0;
  for(let slot=0;slot<4;slot++)if(order[slot]===null)order[slot]=others[n++];
  return order;
 });
}

/* --- STATUS --- */
function radar(vals){
 const mx=Math.max(100,...vals.map(v=>v.total)),cx=110,cy=110,R=74;
 const pt=(i,f)=>{const a=-Math.PI/2+i*Math.PI/2;return [(cx+R*f*Math.cos(a)).toFixed(1),(cy+R*f*Math.sin(a)).toFixed(1)]};
 const ring=f=>[0,1,2,3].map(i=>pt(i,f).join(",")).join(" ");
 const poly=vals.map((v,i)=>pt(i,v.total/mx).join(",")).join(" ");
 const alt=vals.map(v=>v.a.n+" "+v.total).join(", ");
 return '<svg class="radar" viewBox="0 0 220 220" role="img" aria-label="Atributlar: '+alt+'">'+
  [0.25,0.5,0.75,1].map(f=>'<polygon class="rg" points="'+ring(f)+'"/>').join("")+
  [0,1,2,3].map(i=>'<line class="rg" x1="110" y1="110" x2="'+pt(i,1)[0]+'" y2="'+pt(i,1)[1]+'"/>').join("")+
  '<polygon class="rp" points="'+poly+'"/>'+
  vals.map((v,i)=>'<circle class="rd" r="3" cx="'+pt(i,v.total/mx)[0]+'" cy="'+pt(i,v.total/mx)[1]+'"/>').join("")+
  '<text class="rl" x="110" y="12" text-anchor="middle">MIND</text><text class="rl" x="216" y="114" text-anchor="end">BODY</text>'+
  '<text class="rl" x="110" y="216" text-anchor="middle">CHAR</text><text class="rl" x="4" y="114" text-anchor="start">SOC</text></svg>';
}

let _defTry=0,_defEl=null;
async function decodeDefault(){}
function playDefEl(mx){try{const c=sysCtx();if(!c)return false;const n=c.currentTime+.01,d=Math.min(mx||.4,.5),o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(990,n+d*.6);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.15,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+d+.02);return true}catch(e){return false}}
async function loadCustomSound(){await decodeDefault();try{const ab=await _cGet();if(ab)_custom=await _cDecode(ab)}catch(e){}}
function pickCustomSound(){
 const i=document.createElement("input");i.type="file";i.accept="audio/*";
 i.onchange=async()=>{const f=i.files&&i.files[0];if(!f)return;
  if(f.size>3e6){toast("Fayl katta (3 MB gacha boʻlsin)","bad");return}
  try{const ab=await f.arrayBuffer();_custom=await _cDecode(ab);await _cPut(ab);toast("Ovoz saqlandi (faqat shu qurilmada)","gold");systemSound("test",true)}
  catch(e){toast("Bu faylni oʻqib boʻlmadi","bad")}};
 i.click();
}
function clearCustomSound(){_custom=null;_cDel().then(()=>toast("Standart ovozga qaytildi"))}
let systemAudioLastAt=0;
let systemTestTimer=0;
function setSoundTestLabel(label){
 document.querySelectorAll('[data-act="soundTest"] small').forEach(el=>{el.textContent=label});
 if(systemTestTimer)clearTimeout(systemTestTimer);
 if(label!=="TEST")systemTestTimer=setTimeout(()=>setSoundTestLabel("TEST"),1800);
}
function systemSound(kind,force){
 if(S.sound===false&&!force)return Promise.resolve(false);
 const now=Date.now();
 if(kind!=="test"&&now-systemAudioLastAt<130)return Promise.resolve(false);
 systemAudioLastAt=now;
 try{
  const c=sysCtx();if(!c)return Promise.resolve(playDefEl(DUR[kind]));
  const go=function(){const bf=_custom||_def,mx=DUR[kind];
 if(bf){const s=c.createBufferSource(),g=c.createGain(),n=c.currentTime+.01;s.buffer=bf;g.gain.setValueAtTime(1,n);if(mx){g.gain.setValueAtTime(1,n+mx*.6);g.gain.linearRampToValueAtTime(0,n+mx)}s.connect(g);g.connect(c.destination);s.start(n);if(mx)s.stop(n+mx+.02);return true}
 if(!_def)decodeDefault();return playDefEl(mx)};
  return Promise.resolve(c.state!=="running"?c.resume():0).catch(function(){}).then(go).catch(function(){return false});
 }catch(err){
  console.warn("LVLORA audio error:",err);
  return Promise.resolve(false);
 }
}
function testSystemSound(){
 systemAudioLastAt=0;
 setSoundTestLabel("...");
 systemSound("test",true).then(ok=>setSoundTestLabel(ok?"OK":"ERR"));
}
function preloadSystemSounds(){loadCustomSound()}

function openTimer(id){
 const a=TRAIN.find(x=>x.id===id);if(!a||!a.secs)return;
 TM={id:id,total:a.secs,left:a.secs,endAt:0,run:false,iv:0};
 openModal('<div class="win modal"><span class="win-title">Taymer</span>'+
  '<h2>'+a.name+'</h2><p class="muted xs">'+a.unit+'</p>'+
  '<div class="tmwrap"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="tr-bg" cx="80" cy="80" r="70"/>'+
  '<circle id="tmRing" class="tr-fg" cx="80" cy="80" r="70" stroke-dasharray="'+CIRC+'" stroke-dashoffset="0" transform="rotate(-90 80 80)"/></svg>'+
  '<div class="tm-in'+(a.id==="breath"?" breathing":"")+'" id="tmIn"><b class="mono" id="tmText">'+fmtT(a.secs)+'</b><small id="tmPhase"></small></div></div>'+
  '<div class="row-btns"><button class="btn" id="tmGo" data-act="tmToggle">Boshlash</button><button class="btn ghost" data-act="tmCancel">Bekor</button></div>'+
  '<p class="muted xs">Tugagach +'+a.coin+' coin avtomatik beriladi. Sahifani yopma.</p></div>');
}
function tmUI(){
 if(!TM)return;
 const tx=$("#tmText"),rg=$("#tmRing"),go=$("#tmGo"),inn=$("#tmIn"),ph=$("#tmPhase");
 if(!tx)return;
 tx.textContent=fmtT(TM.left);
 rg.setAttribute("stroke-dashoffset",(CIRC*(1-TM.left/TM.total)).toFixed(1));
 go.textContent=TM.run?"Pauza":(TM.left<TM.total?"Davom":"Boshlash");
 if(TM.id==="breath"){
  inn.classList.toggle("go",TM.run);
  const el=TM.total-TM.left;
  ph.textContent=TM.run?["Nafas ol","Ushla","Nafas chiqar","Ushla"][Math.floor((el%16)/4)]:"";
 }
}
function tmTick(){
 if(!TM||!TM.run)return;
 TM.left=Math.max(0,Math.ceil((TM.endAt-Date.now())/1000));
 tmUI();
 if(TM.left<=0)tmFinish();
}
function tmToggle(){
 if(!TM)return;
 if(TM.run){TM.left=Math.max(0,Math.ceil((TM.endAt-Date.now())/1000));TM.run=false;clearInterval(TM.iv)}
 else{TM.run=true;TM.endAt=Date.now()+TM.left*1000;TM.iv=setInterval(tmTick,250)}
 tmUI();
}
function tmFinish(){
 const id=TM.id;clearInterval(TM.iv);TM=null;
 beep();closeModal();
 const a=TRAIN.find(x=>x.id===id);
 if(trainDo(id,true))toast("Taymer tugadi · +"+a.coin+" coin","gold");
}
