ur room, drink water, spend 5 minutes reviewing today's goals.","Уход за лицом и зубами, уборка комнаты, стакан воды, 5 минут на просмотр целей дня."],"Ertalabki badantarbiya":["Morning exercise","Утренняя зарядка"],"Yengil qizdirish, harakatchanlik mashqlari va yengil jismoniy faollik.":["Light warm-up, mobility exercises and gentle physical activity.","Лёгкая разминка, упражнения на подвижность и лёгкая физическая активность."],"Nonushta va tayyorgarlik":["Breakfast and preparation","Завтрак и подготовка"],"Toʻyimli nonushta va kun uchun kerakli narsalarni tayyorla.":["Have a hearty breakfast and get ready what you need for the day.","Плотно позавтракай и подготовь всё нужное на день."],"Mustaqil oʻqish va takrorlash":["Self-study and review","Самостоятельная учёба и повторение"],"Oldingi mavzularni takrorla, tushunmagan savollarni yozib qoʻy.":["Review previous topics and write down questions you didn't understand.","Повтори прошлые темы и запиши непонятные вопросы."],"Asosiy oʻqish va rivojlanish bloki":["Main study and development block","Основной блок учёбы и развития"],"Asosiy missiya. Oʻqituvchini diqqat bilan tingla, muhim joylarni yozib bor, tushunmaganingni soʻra.":["Main mission. Listen to the teacher carefully, note key points, and ask about what you didn't understand.","Главная миссия. Внимательно слушай учителя, записывай важное, спрашивай, если что-то непонятно."],"Tushlik va dam olish":["Lunch and rest","Обед и отдых"],"Tushlik, biroz sayr, tinchlanish.":["Lunch, a short walk, calming down.","Обед, небольшая прогулка, расслабление."],"Chuqur oʻrganish":["Deep study","Глубокое изучение"],"Darsda oʻtilgan mavzularni qayta ishla, konspekt tuz, xatolarni tahlil qil.":["Rework topics covered in class, make notes, analyze your mistakes.","Проработай темы с урока, составь конспект, разбери ошибки."],"Tanaffus":["Break","Перерыв"],"Telefon va ijtimoiy tarmoqlardan meʼyorida foydalan, koʻzlaringni dam ol.":["Use your phone and social media in moderation; rest your eyes.","Пользуйся телефоном и соцсетями в меру, дай глазам отдохнуть."],"Mustaqil mashqlar va tahlil":["Independent practice and analysis","Самостоятельные упражнения и разбор"],"Murakkab topshiriqlarni bajar, xatolar sababini tahlil qil.":["Do difficult tasks and analyze the causes of your mistakes.","Выполни сложные задания и разбери причины ошибок."],"Jismoniy mashgʻulot yoki faol tiklanish":["Physical training or active recovery","Физическая тренировка или активное восстановление"],"Oʻrtacha intensivlikdagi sport. Charchagan boʻlsang, yengil sayr va choʻzilish. Shu vaqtdagi mashqlar Extra Trainingʼda coin beradi.":["Moderate-intensity sport. If you're tired, take a light walk and stretch. Exercises done in this time earn coins in Extra Training.","Спорт средней интенсивности. Если устал, лёгкая прогулка и растяжка. Упражнения в это время приносят монеты в Extra Training."],"Dush va kechki ovqat":["Shower and dinner","Душ и ужин"],"Dush, ovqatlanish va tiklanish.":["Shower, eating and recovery.","Душ, еда и восстановление."],"Shaxsiy bilim va ko‘nikmalar":["Personal knowledge and skills","Личные знания и навыки"],"O‘zing tanlagan foydali ko‘nikma ustida ishlash: o‘qish, yozish, til yoki boshqa yo‘nalish.":["Work on a useful skill of your choice: reading, writing, a language or another area.","Работай над полезным навыком по выбору: чтение, письмо, язык или другое направление."],"Qoʻshimcha oʻqish":["Extra study","Дополнительная учёба"],"Matematika yoki boshqa muhim fanlardan mustaqil taʼlim.":["Self-study in math or other important subjects.","Самообразование по математике или другим важным предметам."],"Shaxsiy rivojlanish":["Personal development","Личное развитие"],"Kitob oʻqish, nutq va odob ustida ishlash, ertangi kunni rejalashtirish.":["Read a book, work on speech and manners, plan tomorrow.","Чтение книги, работа над речью и манерами, планирование завтрашнего дня."],"Kechki tartib":["Evening routine","Вечерний распорядок"],"Shaxsiy parvarish, sokin dam olish va uyquga tayyorgarlik.":["Personal care, quiet relaxation and getting ready for sleep.","Личный уход, тихий отдых и подготовка ко сну."],"Uyqu":["Sleep","Сон"],"Maqsad: 8–9 soat. Uyqu hech qachon EXP uchun qurbon qilinmaydi.":["Goal: 8–9 hours. Sleep is never sacrificed for EXP.","Цель: 8–9 часов. Сном никогда не жертвуют ради EXP."],"Bilim va tafakkur":["Knowledge and thinking","Знания и мышление"],"Jismoniy tayyorgarlik":["Physical fitness","Физическая подготовка"],"Intizom va xarakter":["Discipline and character","Дисциплина и характер"],"Muloqot va xarizma":["Communication and charisma","Общение и харизма"],"Eslab qolish va yodlash":["Remembering and memorizing","Запоминание и заучивание"],"Bugun oʻrganganlaringdan 5 tasini daftarsiz yoddan yozib chiq.":["Write down 5 things you learned today from memory, without your notebook.","Запиши по памяти 5 вещей, которые ты узнал сегодня, без тетради."],"Diqqatni ushlab turish":["Sustaining attention","Удержание внимания"],"25 daqiqa telefonsiz, bitta ish ustida oʻtir.":["Spend 25 minutes on one task, without your phone.","Посиди 25 минут над одним делом без телефона."],"Mantiqiy fikrlash":["Logical thinking","Логическое мышление"],"Bitta mantiqiy masalani bosqichma-bosqich yech.":["Solve one logic problem step by step.","Реши одну логическую задачу шаг за шагом."],"Bilim doirasi":["Range of knowledge","Кругозор"],"Bugun bitta yangi faktni oʻrgan va ovoz chiqarib tushuntir.":["Learn one new fact today and explain it out loud.","Узнай сегодня один новый факт и объясни его вслух."],"Kuch":["Strength","Сила"],"Bir set push-up va bir set squat qil.":["Do one set of push-ups and one set of squats.","Сделай один подход отжиманий и один подход приседаний."],"Chidamlilik":["Endurance","Выносливость"],"Harakatchanlik":["Mobility","Подвижность"],"5 daqiqa choʻzilish: yelka, bel, son.":["5 minutes of stretching: shoulders, back, hips.","5 минут растяжки: плечи, спина, бёдра."],"Muvofiqlik":["Coordination","Координация"],"Bir oyoqda 30 soniya muvozanat saqla, keyin oyoqni almashtir.":["Balance on one leg for 30 seconds, then switch legs.","Постой на одной ноге 30 секунд, затем смени ногу."],"Intizom":["Discipline","Дисциплина"],"Rejadagi bitta ishni kayfiyating yoʻq paytda ham boshla.":["Start one planned task even when you're not in the mood.","Начни одно запланированное дело, даже когда нет настроения."],"Sabr":["Patience","Терпение"],"Bitta ishni shoshilmay, 15 daqiqa uzluksiz bajar.":["Work on one task for 15 minutes straight, without rushing.","Делай одно дело 15 минут без перерыва и без спешки."],"Ishonch":["Confidence","Уверенность"],"Bugun bir marta ovoz chiqarib oʻz fikringni ayt.":["Say your opinion out loud at least once today.","Скажи сегодня вслух своё мнение хотя бы раз."],"Hissiyotni boshqarish":["Managing emotions","Управление эмоциями"],"Jahling chiqsa, javob berishdan oldin 10 gacha sanab nafas ol.":["If you get angry, count to 10 and breathe before answering.","Если разозлился, перед ответом сосчитай до 10 и подыши."],"Muloqot":["Communication","Общение"],"Bir kishiga savol ber va javobini oxirigacha tingla.":["Ask someone a question and listen to the answer to the end.","Задай человеку вопрос и выслушай ответ до конца."],"Odob":["Manners","Воспитанность"],"Yetakchilik":["Leadership","Лидерство"],"Jamoa ishida bitta vazifani oʻz zimmangga ol.":["Take on one task in a team effort.","Возьми на себя одну задачу в командной работе."],"Xarizma":["Charisma","Харизма"],"Suhbatdoshingni ismi bilan chaqirib, koʻziga qarab gapir.":["Call your conversation partner by name and speak while looking them in the eye.","Называй собеседника по имени и говори, глядя ему в глаза."],"1 set · 10 ta":["1 set · 10 reps","1 подход · 10 раз"],"1 set · 15 ta":["1 set · 15 reps","1 подход · 15 раз"],"Yugurish":["Running","Бег"],"Choʻzilish":["Stretching","Растяжка"],"Nafas mashqi":["Breathing exercise","Дыхательное упражнение"],"5 daqiqa · 4-4-4-4 usuli":["5 min · 4-4-4-4 method","5 минут · метод 4-4-4-4"],"10 daqiqa · eʼtibor nafasda":["10 min · focus on your breath","10 минут · внимание на дыхании"],"10 daqiqa · tanani boshdan oyoqqacha":["10 min · the body from head to toe","10 минут · тело от головы до ног"],"Vizualizatsiya":["Visualization","Визуализация"],"5 daqiqa · ertangi maqsadni koʻz oldingga keltir":["5 min · picture tomorrow's goal","5 минут · представь завтрашнюю цель"],"Minnatdorchilik":["Gratitude","Благодарность"],"Oʻzbekcha":["Uzbek","Узбекский"],"Mashgʻulot":["Workout","Тренировка"],"Holat":["Status","Статус"],"Mashq":["Exercise","Упражнение"],"Tizim yuklanmoqda…":["Loading system…","Загрузка системы…"],"Tilni tanla, keyin intizomni boshla.":["Choose your language, then begin your discipline.","Выбери язык, затем начни путь дисциплины."],"Intizomni boshlash":["Start discipline","Начать дисциплину"],"Tillar":["Languages","Языки"],"Boshlangʻich baholash":["Initial assessment","Начальная оценка"],"Oxirgi 7 kundagi haqiqiy odatlaringizni baholang. Ideal javobni emas, amaldagi holatni tanlang.":["Rate your real habits over the last 7 days. Choose what actually happened, not the ideal answer.","Оцените свои реальные привычки за последние 7 дней. Выбирайте то, что было на самом деле, а не идеальный ответ."],"Savol":["Question","Вопрос"],"Deyarli hech qachon":["Almost never","Почти никогда"],"Baʼzan":["Sometimes","Иногда"],"Koʻpincha":["Often","Часто"],"Deyarli doim":["Almost always","Почти всегда"],"Orqaga":["Back","Назад"],"Baholash natijasi":["Assessment result","Результат оценки"],"Kuchli tomon":["Strength","Сильная сторона"],"Rivojlantirish":["To develop","Развивать"],"Bu baho oʻz-oʻzini baholashga asoslangan, aniq oʻlchov emas. 3 haftadan keyin qayta baholash mumkin.":["This score is based on self-assessment, not an exact measure. You can retake it after 3 weeks.","Эта оценка основана на самооценке и не является точным измерением. Пройти её снова можно через 3 недели."],"Tizimga kirish":["Enter the system","Войти в систему"],"Oxirgi 7 kunda oldindan belgilagan vaqtingizda muhim ishni boshlashga qanchalik amal qildingiz?":["Over the last 7 days, how well did you start an important task at the time you had set in advance?","Насколько вы за последние 7 дней начинали важное дело в заранее намеченное время?"],"6–7 kun: odatda belgilangan vaqtda yoki unga yaqin boshladim.":["6–7 days: I usually started at the set time or close to it.","6–7 дней: обычно начинал(а) в назначенное время или около того."],"4–5 kun: ko‘p hollarda boshladim, ayrim kunlari kechikdim.":["4–5 days: I started in most cases, but was late on some days.","4–5 дней: в большинстве случаев начинал(а), в некоторые дни опаздывал(а)."],"2–3 kun: ishni boshlashni tez-tez ortga surdim.":["2–3 days: I often postponed starting the task.","2–3 дня: я часто откладывал(а) начало работы."],"0–1 kun: belgilangan boshlash vaqtiga deyarli amal qilmadim.":["0–1 days: I almost never kept to the set start time.","0–1 дней: я почти не придерживался(ась) намеченного времени начала."],"Rejalashtirgan ishingiz bajarilmay qolganida, keyingi qadamni qanday belgiladingiz?":["When a planned task went undone, how did you set your next step?","Когда запланированное дело не было выполнено, как вы определяли следующий шаг?"],"Sababini aniqlab, bajarish mumkin bo‘lgan aniq yangi vaqt yoki qadam belgiladim.":["I found the reason and set a specific, achievable new time or step.","Я выяснял(а) причину и назначал(а) конкретное новое время или шаг, который реально выполнить."],"Ba’zan yangi reja tuzdim, ba’zan esa keyinga qoldirdim.":["Sometimes I made a new plan, sometimes I put it off.","Иногда я составлял(а) новый план, иногда откладывал(а)."],"Ko‘pincha o‘zimni koyidim, lekin aniq keyingi qadamni belgilamadim.":["I often scolded myself but didn't set a clear next step.","Я часто ругал(а) себя, но не определял(а) чёткий следующий шаг."],"Odatda vazifani tashlab qo‘ydim yoki muddatsiz kechiktirdim.":["I usually dropped the task or postponed it indefinitely.","Обычно я бросал(а) задачу или откладывал(а) её на неопределённый срок."],"Kayfiyatingiz bo‘lmagan kunlarda rejalashtirilgan muhim vazifaga qanday yondashdingiz?":["On days when you weren't in the mood, how did you approach an important planned task?","Как вы подходили к важной запланированной задаче в дни, когда не было настроения?"],"Kichik qismidan boshladim yoki dam olish kerak bo‘lsa, uni aniq vaqtga qayta rejalashtirdim.":["I started with a small part, or if I needed rest, rescheduled it for a specific time.","Я начинал(а) с небольшой части или, если нужен был отдых, переносил(а) её на конкретное время."],"Ayrim kunlari boshladim, ayrim kunlari kechiktirdim.":["Some days I started, some days I delayed.","В одни дни я начинал(а), в другие откладывал(а)."],"Ko‘pincha boshlash uchun kayfiyat kelishini kutdim.":["I often waited for the mood to come before starting.","Я часто ждал(а), пока появится настроение, чтобы начать."],"Kayfiyat bo‘lmasa, vazifani deyarli har safar bekor qildim.":["Without the mood, I almost always cancelled the task.","Без настроения я почти всегда отменял(а) задачу."],"Kunlik natijangizni qayd etayotganda bajarilmagan ishlarni ham qanchalik rost belgiladingiz?":["When logging your daily results, how honestly did you mark the unfinished tasks too?","Насколько честно вы отмечали невыполненные дела, записывая результаты дня?"],"Bajarilgan va qolgan ishlarni farqlab, har safar rost yozdim.":["I told done and remaining tasks apart and wrote honestly every time.","Я различал(а) сделанное и оставшееся и каждый раз писал(а) честно."],"Odatda rost yozdim, ba’zan ayrim ishlarni qayd etishni unutdim.":["I usually wrote honestly, sometimes forgot to log certain tasks.","Обычно я писал(а) честно, иногда забывал(а) отметить некоторые дела."],"Ko‘pincha faqat yaxshi natijalarni yozdim, qolganlarini tashlab ketdim.":["I often wrote only the good results and skipped the rest.","Я часто записывал(а) только хорошие результаты, остальное пропускал(а)."],"Bajarilmagan ishni bajarildi deb belgilagan holatlarim bo‘ldi.":["There were times I marked an unfinished task as done.","Бывало, что я отмечал(а) невыполненное дело как выполненное."],"Boshqa odamga bergan va’dangizni vaqtida bajara olmasligingiz ma’lum bo‘lsa, nima qildingiz?":["When you knew you couldn't keep a promise to someone on time, what did you do?","Что вы делали, когда знали, что не успеете выполнить обещание, данное другому человеку?"],"Oldindan xabar berib, yangi muddat yoki boshqa yechimni kelishdim.":["I let them know in advance and agreed on a new deadline or another solution.","Я заранее предупреждал(а) и договаривался(ась) о новом сроке или другом решении."],"Ko‘p hollarda xabar berdim, ba’zan kechikib aytdim.":["In most cases I let them know, sometimes I told them late.","В большинстве случаев я предупреждал(а), иногда говорил(а) с опозданием."],"Asosan mendan so‘rashgandagina vaziyatni tushuntirdim.":["I mostly explained the situation only when they asked me.","Обычно я объяснял(а) ситуацию, только когда меня спрашивали."],"Odatda xabar bermay, vaziyatni o‘z holiga qo‘ydim.":["I usually didn't say anything and left the situation as it was.","Обычно я ничего не сообщал(а) и оставлял(а) ситуацию как есть."],"O‘qish yoki izlanish paytida tushunarsiz atama uchrasa, oxirgi haftada odatda nima qildingiz?":["When you came across an unfamiliar term while studying or researching, what did you usually do this past week?","Что вы обычно делали на прошлой неделе, встретив непонятный термин при чтении или изучении?"],"Ishonchli manbadan tekshirib, ma’nosini o‘z so‘zim bilan tushuntira oldim.":["I checked a reliable source and could explain the meaning in my own words.","Я проверял(а) по надёжному источнику и мог(ла) объяснить значение своими словами."],"Ko‘pincha tekshirdim, lekin ayrim atamalarni keyinga qoldirdim.":["I often checked, but put off some terms for later.","Я часто проверял(а), но некоторые термины откладывал(а) на потом."],"Faqat mavzuni tushunishimga juda zarur bo‘lsa tekshirdim.":["I checked only if it was essential for understanding the topic.","Я проверял(а), только если это было крайне необходимо для понимания темы."],"Odatda atamani tushunmasdan keyingi qismga o‘tib ketdim.":["I usually moved on to the next part without understanding the term.","Обычно я переходил(а) к следующей части, так и не поняв термин."],"Murakkab topshiriqqa duch kelganingizda uni qanday bajardingiz?":["When you faced a complex task, how did you carry it out?","Как вы выполняли сложное задание, когда с ним сталкивались?"],"Vazifani kichik bosqichlarga ajratib, ketma-ket ishladim.":["I broke the task into small stages and worked through them one by one.","Я разбивал(а) задачу на небольшие этапы и выполнял(а) их по порядку."],"Ba’zan bosqichlarga ajratdim, ba’zan birdaniga bajarishga urindim.":["Sometimes I broke it into stages, sometimes I tried to do it all at once.","Иногда я разбивал(а) на этапы, иногда пытался(ась) сделать всё сразу."],"Ko‘pincha tayyor yechim izladim, lekin sababini chuqur tahlil qilmadim.":["I often looked for a ready-made solution but didn't analyze the cause in depth.","Я часто искал(а) готовое решение, но не анализировал(а) причину глубоко."],"Qiyin tuyulgani uchun ko‘pincha boshlamadim.":["I often didn't start because it seemed hard.","Я часто не начинал(а), потому что это казалось трудным."],"Biror fikringizga qarshi dalil eshitganingizda qanday yo‘l tutdingiz?":["When you heard an argument against one of your opinions, how did you react?","Как вы поступали, услышав довод против вашего мнения?"],"Dalilni tekshirib, kerak bo‘lsa o‘z fikrimni o‘zgartirdim.":["I checked the argument and changed my opinion if needed.","Я проверял(а) довод и при необходимости менял(а) своё мнение."],"Tingladim, lekin tekshirishni har doim ham uddalamadim.":["I listened, but didn't always manage to check it.","Я слушал(а), но не всегда успевал(а) проверить."],"Ko‘pincha o‘z fikrimni himoya qildim, dalilni keyin ko‘rishga qoldirdim.":["I often defended my opinion and left looking at the argument for later.","Я часто защищал(а) своё мнение, а довод оставлял(а) на потом."],"Dalilni tekshirmasdan rad etdim yoki suhbatni to‘xtatdim.":["I rejected the argument without checking it or ended the conversation.","Я отвергал(а) довод, не проверив его, или прекращал(а) разговор."],"Xato javob yoki muvaffaqiyatsiz urinishdan keyin odatda nima qildingiz?":["After a wrong answer or a failed attempt, what did you usually do?","Что вы обычно делали после неверного ответа или неудачной попытки?"],"Xato sababini topib, keyingi urinishda nimani o‘zgartirishni belgiladim.":["I found the cause of the mistake and decided what to change in the next attempt.","Я находил(а) причину ошибки и определял(а), что изменить в следующей попытке."],"Ba’zan sababini ko‘rib chiqdim, ba’zan darhol keyingi ishga o‘tdim.":["Sometimes I looked into the cause, sometimes I moved straight on to the next task.","Иногда я разбирал(а) причину, иногда сразу переходил(а) к следующему делу."],"To‘g‘ri javobni ko‘rdim, ammo xato sababini izlamadim.":["I looked at the right answer but didn't look for the cause of my mistake.","Я смотрел(а) правильный ответ, но не искал(а) причину ошибки."],"Xatoni tekshirmay, shunchaki tashlab qo‘ydim.":["I didn't check the mistake and simply dropped it.","Я не разбирал(а) ошибку и просто бросал(а) это."],"Oxirgi 7 kunda chalg‘ituvchi bildirishnomalar yoki telefon sabab diqqatni yo‘qotganingizda nima qildingiz?":["In the last 7 days, when distracting notifications or your phone made you lose focus, what did you do?","Что вы делали за последние 7 дней, когда отвлекающие уведомления или телефон сбивали ваше внимание?"],"Chalg‘ituvchini chetga olib, e’tiborimni rejalashtirilgan ishga qaytardim.":["I set the distraction aside and brought my attention back to the planned task.","Я убирал(а) отвлекающий фактор и возвращал(а) внимание к запланированному делу."],"Ko‘pincha qaytdim, lekin ba’zan uzoq chalg‘ib qoldim.":["I often came back, but sometimes got distracted for a long time.","Я часто возвращался(ась), но иногда надолго отвлекался(ась)."],"Odatda ishga qaytishim ancha vaqt oldi.":["It usually took me quite a while to get back to work.","Обычно мне требовалось немало времени, чтобы вернуться к работе."],"Ko‘pincha rejalashtirilgan ishni tashlab, telefonda qolib ketdim.":["I often dropped the planned task and got stuck on my phone.","Я часто бросал(а) запланированное дело и застревал(а) в телефоне."],"Oxirgi 7 kunda tanangizga mos yengil yoki o‘rtacha jismoniy harakat (sayr, sport, o‘yin) necha kun bo‘ldi?":["In the last 7 days, on how many days did you do light or moderate physical activity suited to your body (walking, sport, play)?","В течение скольких дней за последние 7 дней вы занимались лёгкой или умеренной физической активностью, подходящей вашему телу (прогулка, спорт, игра)?"],"5–7 kun: muntazam harakat qildim, holatimga mos yuklamani tanladim.":["5–7 days: I was active regularly and chose a load that suited my condition.","5–7 дней: я регулярно двигался(ась) и выбирал(а) нагрузку по самочувствию."],"3–4 kun: bir necha marta harakat qildim.":["3–4 days: I was active a few times.","3–4 дня: я двигался(ась) несколько раз."],"1–2 kun: juda kam harakat qildim.":["1–2 days: I was active very little.","1–2 дня: я двигался(ась) очень мало."],"0 kun: deyarli harakat bo‘lmadi.":["0 days: there was almost no activity.","0 дней: движения почти не было."],"Oxirgi haftada uyqu va dam olish uchun yetarli vaqt ajratishga qanchalik e’tibor berdingiz?":["Over the past week, how much attention did you pay to setting aside enough time for sleep and rest?","Насколько внимательно вы на прошлой неделе выделяли достаточно времени на сон и отдых?"],"Deyarli har kuni uyqu vaqtimni oldindan hisobga oldim.":["Almost every day I planned my sleep time in advance.","Почти каждый день я заранее учитывал(а) время для сна."],"Ko‘p kunlari e’tibor berdim, ayrim kunlari kech yotdim.":["I paid attention on most days, but went to bed late on some.","В большинстве дней я следил(а) за этим, в некоторые дни ложился(ась) поздно."],"Ko‘pincha uyquni boshqa ishlar sabab kechiktirdim.":["I often delayed sleep because of other things.","Я часто откладывал(а) сон из-за других дел."],"Uyqu vaqtini deyarli rejalashtirmadim.":["I almost never planned my sleep time.","Я почти не планировал(а) время для сна."],"Uzoq vaqt o‘tirib qolganda tanaffus qilib, biroz yurish yoki cho‘zilishni qanchalik odat qildingiz?":["How much did you make it a habit to take a break and walk or stretch a bit after sitting for a long time?","Насколько вы привыкли делать перерыв, немного пройтись или размяться после долгого сидения?"],"Ko‘p hollarda tanaffus qildim va tanamni harakatlantirdim.":["In most cases I took a break and moved my body.","В большинстве случаев я делал(а) перерыв и двигался(ась)."],"Ba’zan tanaffus qildim, ba’zan unutdim.":["Sometimes I took a break, sometimes I forgot.","Иногда я делал(а) перерыв, иногда забывал(а)."],"Kamdan-kam tanaffus qildim.":["I rarely took breaks.","Я лишь изредка делал(а) перерывы."],"Deyarli butun vaqt harakatsiz o‘tirdim.":["I sat motionless almost the entire time.","Почти всё время я сидел(а) без движения."],"Kundalik ovqatlanishda muntazam va xilma-xil ovqatlanishga qanchalik amal qildingiz?":["In your daily eating, how well did you follow regular and varied meals?","Насколько вы придерживались регулярного и разнообразного питания в течение дня?"],"Ko‘p kunlari muntazam ovqatlandim va turli oziq-ovqatlarni tanladim.":["On most days I ate regularly and chose a variety of foods.","В большинстве дней я питался(ась) регулярно и выбирал(а) разные продукты."],"Odatda yaxshi yo‘l tutdim, lekin ayrim mahal ovqatni o‘tkazib yubordim.":["I usually did well, but skipped meals at times.","Обычно у меня всё получалось, но иногда я пропускал(а) приёмы пищи."],"Ovqatlanish vaqtim ko‘pincha tartibsiz bo‘ldi.":["My mealtimes were often irregular.","Время приёмов пищи у меня часто было нерегулярным."],"Ovqatlanishimga deyarli e’tibor bermadim.":["I hardly paid attention to my eating.","Я почти не обращал(а) внимания на своё питание."],"Mashq yoki faoliyat paytida og‘riq, bosh aylanishi yoki kuchli charchoq sezsangiz, qanday yo‘l tutdingiz?":["If you felt pain, dizziness or strong fatigue during exercise or activity, how did you act?","Как вы поступали, если во время упражнений или занятий чувствовали боль, головокружение или сильную усталость?"],"To‘xtadim yoki yuklamani kamaytirdim, zarur bo‘lsa kattalardan yordam so‘radim.":["I stopped or reduced the load, and asked an adult for help if necessary.","Я останавливался(ась) или снижал(а) нагрузку, а при необходимости просил(а) помощи у взрослых."],"Ko‘pincha holatimni hisobga oldim, ba’zan kech payqadim.":["I often took my condition into account, sometimes I noticed too late.","Я часто учитывал(а) своё состояние, иногда замечал(а) слишком поздно."],"Ba’zan noqulaylikka qaramay davom etdim.":["Sometimes I kept going despite discomfort.","Иногда я продолжал(а), несмотря на дискомфорт."],"Ko‘pincha tana signallarini e’tiborsiz qoldirdim.":["I often ignored my body's signals.","Я часто игнорировал(а) сигналы своего тела."],"Suhbatdoshingiz gapirayotganda uni bo‘lmasdan tinglashga oxirgi haftada qanchalik amal qildingiz?":["Over the past week, how well did you listen to the other person without interrupting?","Насколько вы на прошлой неделе слушали собеседника, не перебивая?"],"Deyarli har safar gapini tugatishini kutib, tushunmagan joyimni so‘radim.":["Almost every time I waited for them to finish and asked about what I didn't understand.","Почти каждый раз я дожидался(ась), пока человек закончит, и переспрашивал(а) то, что не понял(а)."],"Ko‘pincha tingladim, ba’zan gapini bo‘ldim.":["I often listened, sometimes I interrupted.","Я часто слушал(а), иногда перебивал(а)."],"Tez-tez gapini bo‘ldim yoki javob tayyorlash bilan band bo‘ldim.":["I often interrupted or was busy preparing my reply.","Я часто перебивал(а) или был(а) занят(а) подготовкой ответа."],"Ko‘pincha tinglamasdan, o‘z gapimni aytishga shoshildim.":["I often rushed to say my piece without listening.","Я часто, не слушая, спешил(а) высказать своё."],"Kimdir bilan fikringiz to‘g‘ri kelmaganda, odatda qanday munosabat bildirdingiz?":["When you disagreed with someone, how did you usually react?","Как вы обычно реагировали, когда ваше мнение не совпадало с мнением другого человека?"],"Fikrimni hurmat bilan tushuntirib, uning sababini ham tingladim.":["I explained my view respectfully and also listened to their reasons.","Я уважительно объяснял(а) своё мнение и выслушивал(а) причины другого."],"Ko‘pincha xotirjam gaplashdim, ba’zan hissiyotga berildim.":["I often talked calmly, sometimes I gave in to emotion.","Я часто говорил(а) спокойно, иногда поддавался(ась) эмоциям."],"Ko‘pincha suhbatdan qochdim yoki keskin javob berdim.":["I often avoided the conversation or answered sharply.","Я часто уходил(а) от разговора или отвечал(а) резко."],"Shaxsiyatiga tegadigan gaplar bilan javob bergan paytlarim bo‘ldi.":["There were times I replied with remarks that got personal.","Бывало, что я отвечал(а) личными оскорбительными замечаниями."],"Jamoaviy ishda o‘zingizga tegishli vazifani qanday bajardingiz?":["In teamwork, how did you carry out the task that was yours?","Как вы выполняли свою часть задачи в командной работе?"],"Kelishilgan vazifani bajardim; muammo bo‘lsa, jamoaga oldindan aytdim.":["I did the agreed task; if there was a problem, I told the team in advance.","Я выполнял(а) согласованную задачу; при проблемах заранее сообщал(а) команде."],"Asosan bajardim, ayrim qismlarini kechiktirdim.":["I mostly did it, but delayed some parts.","В основном я выполнял(а), но некоторые части откладывал(а)."],"Ko‘pincha boshqalarning eslatishidan keyin ishga kirishdim.":["I often got to work only after others reminded me.","Я часто брался(лась) за работу только после напоминания других."],"Mas’uliyatni boshqalarga qoldirgan holatlarim ko‘p bo‘ldi.":["There were many times I left responsibility to others.","Часто бывало, что я перекладывал(а) ответственность на других."],"Biror narsani tushunmay qolsangiz yoki yordam kerak bo‘lsa, odatda nima qildingiz?":["When you didn't understand something or needed help, what did you usually do?","Что вы обычно делали, когда чего-то не понимали или нуждались в помощи?"],"Aniq savol berdim yoki kerakli odamdan yordam so‘radim.":["I asked a clear question or asked the right person for help.","Я задавал(а) чёткий вопрос или просил(а) помощи у нужного человека."],"Ba’zan so‘radim, ba’zan o‘zim hal qilishga uzoq vaqt sarfladim.":["Sometimes I asked, sometimes I spent a long time trying to solve it myself.","Иногда я спрашивал(а), иногда долго пытался(ась) решить сам(а)."],"Ko‘pincha so‘rashga tortindim va muammoni ichimda saqladim.":["I was often too shy to ask and kept the problem to myself.","Я часто стеснялся(ась) спросить и держал(а) проблему в себе."],"Yordam kerakligini aytmay, vazifani tashlab qo‘ydim.":["I didn't say I needed help and just dropped the task.","Я не говорил(а), что нужна помощь, и бросал(а) задачу."],"Boshqa odamga noqulaylik tug‘dirganingizni sezganingizda odatda nima qildingiz?":["When you noticed you had caused someone discomfort, what did you usually do?","Что вы обычно делали, заметив, что причинили другому человеку неудобство?"],"Buni tan olib, uzr so‘radim va vaziyatni tuzatishga harakat qildim.":["I admitted it, apologized and tried to make things right.","Я признавал(а) это, извинялся(ась) и старался(ась) исправить ситуацию."],"Ko‘pincha tushuntirdim, lekin ba’zan uzr so‘rashni kechiktirdim.":["I often explained, but sometimes delayed apologizing.","Я часто объяснял(а), но иногда откладывал(а) извинение."],"Odatda mavzuni o‘zgartirdim yoki indamadim.":["I usually changed the subject or stayed silent.","Обычно я менял(а) тему или молчал(а)."],"Xatoni tan olish o‘rniga ko‘pincha boshqani aybladim.":["Instead of admitting the mistake, I often blamed someone else.","Вместо того чтобы признать ошибку, я часто винил(а) другого."],"Sayohatchi":["Traveler","Путник"],"Mustaqil rivojlanish":["Self-development","Саморазвитие"],"Oʻzing tanlagan foydali mashgʻulotni bajar yoki dam ol.":["Do a useful activity of your choice, or rest.","Займись полезным делом по своему выбору или отдохни."],"Tushundim":["Got it","Понятно"],"TIKLANISH KUNI":["RECOVERY DAY","ДЕНЬ ВОССТАНОВЛЕНИЯ"],"[LVLORA] Kecha reja toʻliq bajarilmadi, seriya toʻxtadi.":["[LVLORA] Yesterday's plan wasn't fully completed, the streak stopped.","[LVLORA] Вчерашний план выполнен не полностью, серия прервалась."],"Xafa boʻlma: bugun hamma EXP toʻliq beriladi.":["Don't be upset: today all EXP is awarded in full.","Не расстраивайся: сегодня весь EXP начисляется полностью."],"Kichik qadamdan boshla va seriyani qaytadan boshla.":["Start with a small step and begin your streak again.","Начни с маленького шага и начни серию заново."],"KUNLIK VAZIFA":["DAILY QUEST","ЕЖЕДНЕВНОЕ ЗАДАНИЕ"],"[LVLORA] Yangi kunlik vazifa keldi.":["[LVLORA] A new daily quest has arrived.","[LVLORA] Пришло новое ежедневное задание."],"Maqsad: kamida":["Goal: at least","Цель: не менее"],"Bajarsang, seriyang davom etadi.":["Complete it and your streak continues.","Выполнишь — и твоя серия продолжится."],"Takrorlash oraliqli boʻlsin: mavzuni 1, 3 va 7 kundan keyin yana koʻrib chiq.":["Make your review spaced: go over the topic again after 1, 3 and 7 days.","Повторяй с интервалами: просмотри тему снова через 1, 3 и 7 дней."],"Oʻqiganingni yopib qoʻyib yoddan yozib chiq. Bu qayta-qayta oʻqishdan kuchliroq ishlaydi.":["Close what you read and write it out from memory. This works better than rereading again and again.","Закрой прочитанное и запиши по памяти. Это работает лучше, чем перечитывать снова и снова."],"Har 20 daqiqada 20 soniya uzoqqa qara. Koʻzlar kam charchaydi.":["Every 20 minutes, look far away for 20 seconds. Your eyes will tire less.","Каждые 20 минут смотри вдаль 20 секунд. Глаза будут меньше уставать."],"Uxlashdan 30 daqiqa oldin ekranni oʻchir: uyqu tezroq keladi.":["Turn off the screen 30 minutes before bed: sleep comes faster.","Выключай экран за 30 минут до сна: уснёшь быстрее."],"Qahva va energetik ichimliklarni tushdan keyin ichma, ular uyquni buzadi.":["Don't drink coffee or energy drinks in the afternoon; they ruin your sleep.","Не пей кофе и энергетики после обеда: они портят сон."],"Oʻtirganda orqa tik, oyoqlar yerda, ekran koʻz balandligida boʻlsin.":["Sit with your back straight, feet on the floor, and the screen at eye level.","Сиди с прямой спиной, ноги на полу, экран на уровне глаз."],"Xato ustida ishlash eng tez oʻsish yoʻli: har xato uchun bitta qoida yoz.":["Working on mistakes is the fastest way to grow: write one rule for every mistake.","Работа над ошибками — самый быстрый путь роста: напиши по одному правилу на каждую ошибку."],"Har kuni bir xil vaqtda yotib, bir xil vaqtda tursang, tana tez moslashadi.":["If you go to bed and wake up at the same time every day, your body adapts quickly.","Если ложиться и вставать в одно и то же время каждый день, тело быстро привыкает."],"Qiyin mavzuni boshqa odamga tushuntirib koʻr: tushunmagan joying darrov bilinadi.":["Try explaining a hard topic to someone else: the gaps in your understanding show up right away.","Попробуй объяснить сложную тему другому человеку: пробелы в понимании сразу видны."],"Suv":["Water","Вода"],"Suv meʼyori bajarildi. Qoyil!":["Water goal completed. Well done!","Норма воды выполнена. Молодец!"],"Hozirgacha":["So far","Пока что"],"ml ichding. Shu vaqtga taxminan":["ml drunk. By this time about","мл выпито. К этому времени примерно"],"ml boʻlishi kerak. Bir stakan suv ich.":["ml is expected. Drink a glass of water.","мл должно быть. Выпей стакан воды."],"Kecha":["Yesterday","Вчера"],"soat uxlading. Bugun erta yot va ekranni uxlashdan oldin oʻchir.":["hours of sleep. Go to bed early today and turn off the screen before sleeping.","часов сна. Сегодня ложись пораньше и выключи экран перед сном."],"Uxlash vaqti yaqin. Ekranni oʻchir, suv ich, ertangi rejani koʻrib chiq.":["Bedtime is near. Turn off the screen, drink some water, and review tomorrow's plan.","Скоро время сна. Выключи экран, выпей воды и просмотри план на завтра."],"Maslahat":["Tip","Совет"],"Yutuq:":["Achievement:","Достижение:"],"Kelajak kunini belgilab boʻlmaydi":["A future day cannot be marked","Будущий день нельзя отметить"],"Oʻtgan kunni oʻzgartirib boʻlmaydi":["A past day cannot be changed","Прошедший день нельзя изменить"],"Bu EXP allaqachon sarflangan, bekor qilib boʻlmaydi":["This EXP has already been spent and cannot be undone","Этот EXP уже потрачен, отменить нельзя"],"Kunlik 100 EXP chegarasi toʻldi, bu vazifa EXP bermaydi":["The daily 100 EXP limit is reached; this task gives no EXP","Дневной лимит в 100 EXP достигнут, эта задача не даёт EXP"],"EXP yetmaydi: kerak":["Not enough EXP: need","Не хватает EXP: нужно"],"Bugungi limit:":["Today's limit:","Лимит на сегодня:"],"Kunlik":["Daily","Дневной"],"coin chegarasi toʻldi. Tiklan.":["coin limit reached. Recover.","лимит coin достигнут. Восстановись."],"Bu coin allaqachon sarflangan":["This coin has already been spent","Этот coin уже потрачен"],"Meʼyor mukofoti olingan, kamaytirib boʻlmaydi":["Goal reward already claimed, cannot be reduced","Награда за норму уже получена, уменьшить нельзя"],"Suv meʼyori bajarildi":["Water goal completed","Норма воды выполнена"],"Yetarli uyqu":["Enough sleep","Достаточно сна"],"Sinov hali yengilmagan":["Challenge not yet defeated","Испытание ещё не пройдено"],"Sinov yengildi! +100 coin":["Challenge defeated! +100 coin","Испытание пройдено! +100 coin"],"Coin yetmaydi":["Not enough Coin","Не хватает Coin"],"Sumkaga qoʻshildi":["Added to Bag","Добавлено в сумку"],"Sotib olindi va qoʻllandi":["Purchased and applied","Куплено и применено"],"Bugun boost allaqachon yoqilgan":["Boost is already on today","Буст уже включён сегодня"],"Chegirma allaqachon faol":["Discount is already active","Скидка уже активна"],"Mukofot":["Reward","Награда"],"ishlatildi. Zavqlan!":["used. Enjoy!","использовано. Наслаждайся!"],"Bu kun tizim boshlanishidan oldin":["This day is before the system started","Этот день раньше начала работы системы"],"Bu kunga vaucher kerak emas":["No voucher is needed for this day","Для этого дня ваучер не нужен"],"Dam kuni belgilandi:":["Rest day set:","День отдыха назначен:"],"Vazifa nomini yoz":["Enter the task name","Введи название задачи"],"Maxsus vazifalar 4 tadan oshmasin":["Custom tasks must not exceed 4","Особых задач должно быть не больше 4"],"Boshlanish vaqtini tanla":["Choose a start time","Выбери время начала"],"Tugash vaqti notoʻgʻri":["Invalid end time","Неверное время окончания"],"Vazifa qoʻshildi":["Task added","Задача добавлена"],"Standart reja tiklandi":["Default plan restored","Стандартный план восстановлен"],"Nik 3–16 belgi boʻlsin: lotin harflari, raqam va _ . Band soʻzlar (admin, support...) mumkin emas.":["Nickname must be 3–16 characters: Latin letters, digits and _ . Reserved words (admin, support...) are not allowed.","Ник должен быть из 3–16 символов: латинские буквы, цифры и _ . Зарезервированные слова (admin, support...) нельзя."],"Parol kamida 8 belgi boʻlsin.":["Password must be at least 8 characters.","Пароль должен быть не короче 8 символов."],"Ikkala parol bir xil emas.":["The two passwords do not match.","Пароли не совпадают."],"Shartlarga rozilik kerak.":["You must accept the terms.","Нужно согласиться с условиями."],"Bu nik shu qurilmada band.":["This nickname is taken on this device.","Этот ник занят на этом устройстве."],"Profil yaratildi: @":["Profile created: @","Профиль создан: @"],"Koʻp urinish.":["Too many attempts.","Слишком много попыток."],"Nik yoki parol notoʻgʻri.":["Wrong nickname or password.","Неверный ник или пароль."],"Xush kelibsan, @":["Welcome, @","Добро пожаловать, @"],"Profil oʻchirildi":["Profile deleted","Профиль удалён"],"Bunday nik topilmadi.":["No such nickname found.","Такой ник не найден."],"Profil oʻchirildi. Yangidan yaratishing mumkin.":["Profile deleted. You can create a new one.","Профиль удалён. Ты можешь создать новый."],"Yangi parol kamida 8 belgi boʻlsin":["New password must be at least 8 characters","Новый пароль должен быть не короче 8 символов"],"Parol yangilandi":["Password updated","Пароль обновлён"],"Ilova nik, parol xeshi (parolning oʻzi emas) va oʻz progressingni faqat shu qurilmadagi brauzerda saqlaydi.":["The app stores your nickname, password hash (not the password itself) and your progress only in the browser on this device.","Приложение хранит ник, хеш пароля (не сам пароль) и твой прогресс только в браузере на этом устройстве."],"Serverga maʼlumot yuborilmaydi; reklama va kuzatuv (analitika) yoʻq.":["No data is sent to a server; there are no ads or tracking (analytics).","Данные на сервер не отправляются; рекламы и отслеживания (аналитики) нет."],"Profilni oʻchirsang, uning maʼlumotlari shu qurilmadan oʻchadi. Brauzer maʼlumotlarini tozalash progressni ham oʻchiradi.":["If you delete the profile, its data is removed from this device. Clearing browser data also erases your progress.","Если удалишь профиль, его данные исчезнут с этого устройства. Очистка данных браузера тоже сотрёт прогресс."],"Parolni unutsang, tiklab boʻlmaydi.":["If you forget your password, it cannot be recovered.","Если забудешь пароль, его нельзя восстановить."],"Ilova 13 yoshdan katta foydalanuvchilar uchun. Bu tibbiy maslahat emas; coin pul emas, faqat ilova ichidagi ball.":["The app is for users over 13. This is not medical advice; coin is not money, only an in-app point.","Приложение для пользователей старше 13 лет. Это не медицинская рекомендация; coin — не деньги, а лишь внутриигровые баллы."],"Shaxsiy, maxfiy yoki tibbiy maʼlumot kiritma.":["Do not enter personal, confidential or medical information.","Не вводи личные, конфиденциальные или медицинские данные."],"Shartlar":["Terms","Условия"],"Yopish":["Close","Закрыть"],"Kunlik Mashgʻulotlar":["Daily Workouts","Ежедневные тренировки"],"Yoʻriqnoma":["Guide","Руководство"],"YANGI QADAM":["NEW STEP","НОВЫЙ ШАГ"],"IZLOVCHI":["SEEKER","ИСКАТЕЛЬ"],"TAJRIBALI":["EXPERIENCED","ОПЫТНЫЙ"],"USTA":["MASTER","МАСТЕР"],"USTOZ":["MENTOR","НАСТАВНИК"],"AFSONAVIY":["LEGENDARY","ЛЕГЕНДАРНЫЙ"],"<button class=\"chip gold\" data-act=\"go\" data-w=\"shop\" aria-label=\"Coin:":["<button class=\"chip gold\" data-act=\"go\" data-w=\"shop\" aria-label=\"Coin:","<button class=\"chip gold\" data-act=\"go\" data-w=\"shop\" aria-label=\"Coin:"],"<button class=\"chip vio\" data-act=\"go\" data-w=\"skills\" aria-label=\"EXP hamyon:":["<button class=\"chip vio\" data-act=\"go\" data-w=\"skills\" aria-label=\"EXP wallet:","<button class=\"chip vio\" data-act=\"go\" data-w=\"skills\" aria-label=\"Кошелёк EXP:"],"<button class=\"chip sound-chip\" data-act=\"soundToggle\" aria-label=\"Tovushni":["<button class=\"chip sound-chip\" data-act=\"soundToggle\" aria-label=\"Sound","<button class=\"chip sound-chip\" data-act=\"soundToggle\" aria-label=\"Звук"],"oʻchirish":["turn off","выключить"],"\" title=\"System tovushini yoqish yoki o‘chirish\">":["\" title=\"Turn System sound on or off\">","\" title=\"Включить или выключить звук System\">"],"Level up tayyor":["Level up ready","Level up готов"],"01 · BOSHLASH":["01 · GET STARTED","01 · НАЧАЛО"],"Tilni tanla, boshlangʻich baholashni yakunla va profilingga nom ber. Bu baholash tashxis emas — odatlaringni kuzatish uchun boshlangʻich nuqta.":["Choose a language, complete the initial assessment and give your profile a name. This assessment is not a diagnosis — it is a starting point for tracking your habits.","Выбери язык, пройди начальную оценку и дай имя своему профилю. Эта оценка — не диагноз, а отправная точка для отслеживания твоих привычек."],"02 · STATUS":["02 · STATUS","02 · STATUS"],"Level, Rank, atributlar va umumiy rivojlanishingni kuzat. Avatar, unvon va ko‘rinishlarni shu oynada boshqar.":["Track your Level, Rank, attributes and overall progress. Manage your avatar, title and appearance in this window.","Следи за своим Level, Rank, атрибутами и общим прогрессом. Управляй аватаром, титулом и внешним видом в этом окне."],"03 · KUNLIK VAZIFALAR":["03 · DAILY TASKS","03 · ЕЖЕДНЕВНЫЕ ЗАДАЧИ"],"Kunlik vazifalarni ko‘r, bajarganingni belgilab bor va kerak bo‘lsa rejangni tahrirla. Vazifalarni real imkoniyatingga mosla; dam olishni ham rejaning bir qismi deb bil.":["View your daily tasks, mark what you've completed and edit your plan if needed. Adapt tasks to your real capacity; treat rest as part of the plan too.","Смотри ежедневные задачи, отмечай выполненное и при необходимости правь свой план. Подбирай задачи под свои реальные возможности; считай отдых частью плана."],"04 · EXP & SKILLS":["04 · EXP & SKILLS","04 · EXP & SKILLS"],"Vazifalar EXP beradi. Yetarli EXP yig‘ilganda Level oshirishing mumkin. Skill’larni bosqichma-bosqich rivojlantir; natijani faqat raqam bilan emas, haqiqiy o‘rganish bilan bahola.":["Tasks give EXP. When you've collected enough EXP, you can raise your Level. Develop Skills step by step; judge results not only by numbers but by real learning.","Задачи дают EXP. Когда наберёшь достаточно EXP, сможешь повысить Level. Развивай Skills шаг за шагом; оценивай результат не только цифрами, но и реальным обучением."],"05 · HEALTH & TRAINING":["05 · HEALTH & TRAINING","05 · HEALTH & TRAINING"],"Health kundalik odatlarni qayd etish uchun, tibbiy maslahat yoki tashxis emas. Training’da yengil mashqlar, tanaffus va diqqat mashqlaridan foydalan. Og‘riq yoki noqulaylik bo‘lsa, to‘xta.":["Health is for logging daily habits, not medical advice or diagnosis. In Training, use light exercises, breaks and focus exercises. If you feel pain or discomfort, stop.","Health нужен для записи ежедневных привычек, а не для медицинских советов или диагнозов. В Training используй лёгкие упражнения, перерывы и упражнения на концентрацию. Если почувствуешь боль или дискомфорт, остановись."],"06 · SHOP & BAG":["06 · SHOP & BAG","06 · SHOP & BAG"],"Coin’larni vazifalar va yutuqlardan yig‘. Ular faqat ilova ichidagi ball, haqiqiy pul emas va yechib olinmaydi. Shop’da mukofot tanla; ishlatiladigan mukofotlar Bag’da ko‘rinadi. Coin uchun uyqu, ovqatlanish yoki sog‘liqni qurbon qilma.":["Collect Coins from tasks and achievements. They are only in-app points, not real money, and cannot be withdrawn. Choose a reward in the Shop; consumable rewards appear in the Bag. Don't sacrifice sleep, food or health for Coins.","Собирай Coin за задачи и достижения. Это только внутриигровые баллы, а не настоящие деньги, и их нельзя вывести. Выбирай награду в Shop; расходуемые награды появляются в Bag. Не жертвуй ради Coin сном, питанием или здоровьем."],"07 · SOZLAMALAR":["07 · SETTINGS","07 · НАСТРОЙКИ"],"Tilni almashtir, tovushni yoq/o‘chir va profilingni yangila. Boshqa qurilmaga o‘tishdan oldin ma’lumotlaringni saqlash imkoniyatini tekshir.":["Change the language, turn sound on/off and update your profile. Before moving to another device, check your options for saving your data.","Смени язык, включи/выключи звук и обнови профиль. Перед переходом на другое устройство проверь возможность сохранить свои данные."],"MUHIM · MA’LUMOTLAR":["IMPORTANT · DATA","ВАЖНО · ДАННЫЕ"],"Ushbu HTML versiyada ma’lumotlar shu brauzer/qurilmada saqlanadi. Nik va parol bilan profil ham shu qurilmada saqlanadi; server, cloud sync va zaxira nusxa hozircha yoʻq. Brauzer ma’lumotlarini tozalash progressni yo‘qotishi mumkin. Maxfiy yoki tibbiy ma’lumotlarni kiritma.":["In this HTML version, data is stored in this browser/device. A profile with nickname and password is also stored on this device; there is no server, cloud sync or backup for now. Clearing browser data may lose your progress. Do not enter confidential or medical data.","В этой HTML-версии данные хранятся в этом браузере/на этом устройстве. Профиль с ником и паролем тоже хранится на этом устройстве; сервера, облачной синхронизации и резервной копии пока нет. Очистка данных браузера может привести к потере прогресса. Не вводи конфиденциальные или медицинские данные."],"Tizimdan foydalanish yoʻriqnomasi":["How to use the system","Как пользоваться системой"],"LVLORA — kundalik maqsadlar, odatlar va ko‘nikmalarni o‘yin uslubida kuzatish vositasi.":["LVLORA — a tool for tracking daily goals, habits and skills in a game style.","LVLORA — инструмент для отслеживания ежедневных целей, привычек и навыков в игровом стиле."],"TAVSIYA":["TIP","СОВЕТ"],"Kichik, davomli qadamlar katta sakrashlardan yaxshiroq.":["Small, consistent steps are better than big leaps.","Маленькие регулярные шаги лучше больших рывков."],"Bir kun o‘tkazib yuborsang, ikki baravar yuklama qo‘shma. Oddiy rejangga qayt.":["If you skip a day, don't pile on double the workload. Go back to your normal plan.","Если пропустишь день, не набирай двойную нагрузку. Вернись к обычному плану."],"Profilim bor: kirish":["I have a profile: log in","У меня есть профиль: войти"],"Profil yaratish":["Create profile","Создать профиль"],"Tovush: OFF":["Sound: OFF","Звук: ВЫКЛ"],"Tovush: ON":["Sound: ON","Звук: ВКЛ"],"Atributlar 100 dan boshlanadi. Tanlangan javoblar oxirgi 7 kundagi odatlaringiz bo‘yicha bahoni shakllantiradi.":["Attributes start at 100. The answers you choose shape the estimate based on your habits over the last 7 days.","Атрибуты начинаются со 100. Выбранные ответы формируют оценку по твоим привычкам за последние 7 дней."],"Javoblar o‘z-o‘zini baholashga asoslangan: tizim yolg‘onni aniq aniqlay olmaydi, shuning uchun oxirgi haftadagi haqiqiy xatti-harakatlaringizni tanlang.":["Answers are based on self-assessment: the system cannot reliably detect lies, so choose your actual behavior over the past week.","Ответы основаны на самооценке: система не может точно распознать ложь, поэтому выбирай своё реальное поведение за последнюю неделю."],"PROFIL":["PROFILE","ПРОФИЛЬ"],"\" data-act=\"authMode\" data-k=\"login\">Kirish":["\" data-act=\"authMode\" data-k=\"login\">Log in","\" data-act=\"authMode\" data-k=\"login\">Войти"],"\" data-act=\"authMode\" data-k=\"register\">Profil yaratish":["\" data-act=\"authMode\" data-k=\"register\">Create profile","\" data-act=\"authMode\" data-k=\"register\">Создать профиль"],"Profil maʼlumotlari faqat shu qurilmadagi brauzerda saqlanadi, serverga yuborilmaydi. Parol ilovaga kirishni himoyalaydi, lekin maʼlumotni shifrlamaydi. Parolni unutsang, tiklab boʻlmaydi.":["Profile data is stored only in the browser on this device and is not sent to a server. The password protects access to the app but does not encrypt the data. If you forget your password, it cannot be recovered.","Данные профиля хранятся только в браузере на этом устройстве и не отправляются на сервер. Пароль защищает вход в приложение, но не шифрует данные. Если забудешь пароль, его нельзя восстановить."],"Nik (lotin harflari, raqam, _)":["Nickname (Latin letters, digits, _)","Ник (латинские буквы, цифры, _)"],"Parol":["Password","Пароль"],"Parolni takrorla":["Repeat password","Повтори пароль"],"Men 13 yoshdan katta ekanligimni tasdiqlayman.":["I confirm that I am over 13 years old.","Подтверждаю, что мне больше 13 лет."],"Shartlarga roziman.":["I agree to the terms.","Я согласен с условиями."],"Shartlarni oʻqish":["Read the terms","Прочитать условия"],"Kirish":["Log in","Войти"],"Ha, oʻchir":["Yes, delete","Да, удалить"],"Yoʻq":["No","Нет"],"Parolni unutdim":["I forgot my password","Я забыл пароль"],"Profil":["Profile","Профиль"],"Shu qurilmada saqlanadi":["Stored on this device","Хранится на этом устройстве"],"Profil maʼlumotlari faqat shu brauzerda saqlanadi, serverga yuborilmaydi. Parolni unutsang, tiklab boʻlmaydi.":["Profile data is stored only in this browser and is not sent to a server. If you forget your password, it cannot be recovered.","Данные профиля хранятся только в этом браузере и не отправляются на сервер. Если забудешь пароль, его нельзя восстановить."],"Eski parol":["Old password","Старый пароль"],"Yangi parol (kamida 8)":["New password (at least 8)","Новый пароль (не менее 8)"],"Saqlash":["Save","Сохранить"],"Bekor":["Cancel","Отмена"],"Parolni oʻzgartirish":["Change password","Сменить пароль"],"Chiqish":["Log out","Выйти"],"Profil va progress oʻchadi. Rostdan ham?":["Profile and progress will be erased. Really?","Профиль и прогресс будут удалены. Точно?"],"Profilni oʻchirish":["Delete profile","Удалить профиль"],"Mehmon":["Guest","Гость"],"Hozir mehmon rejimidasan: progress shu brauzerda saqlanadi. Nik va parol bilan profil yaratsang, progressing profilga bogʻlanadi (baribir faqat shu qurilmada).":["You are in guest mode now: progress is stored in this browser. If you create a profile with a nickname and password, your progress will be linked to the profile (still only on this device).","Сейчас ты в гостевом режиме: прогресс хранится в этом браузере. Если создашь профиль с ником и паролем, прогресс привяжется к профилю (всё равно только на этом устройстве)."],"Birinchi Qadam":["First Step","Первый шаг"],"LVLORA olamida har bir sayohatchi kichik odatdan boshlaydi. Bugungi vazifalar sening birinchi yoʻlingdir.":["In the world of LVLORA every traveler starts with a small habit. Today's tasks are your first path.","В мире LVLORA каждый путник начинает с маленькой привычки. Сегодняшние задачи — твой первый путь."],"Sokin Daryo":["Quiet River","Тихая река"],"Tartib daryoga oʻxshaydi: sekin, lekin toʻxtovsiz oqadi. Har kuni bir tomchi qoʻsh.":["Order is like a river: slow but unstoppable. Add one drop every day.","Порядок похож на реку: течёт медленно, но неостановимо. Добавляй по капле каждый день."],"Toshli Yoʻl":["Stony Road","Каменистая дорога"],"Yoʻl qiyinlashdi. Kayfiying yoʻq kunlarda ham kichik bir qadam yoʻlni davom ettiradi.":["The road got harder. Even on days when you're not in the mood, one small step keeps the journey going.","Дорога стала труднее. Даже в дни без настроения один маленький шаг продолжает путь."],"Shamol Dovoni":["Windy Pass","Ветреный перевал"],"Dovon tepasida shamol kuchli. Seriyang seni oldinga itaradigan shamolga aylanadi.":["The wind is strong at the top of the pass. Your streak becomes the wind that pushes you forward.","На вершине перевала сильный ветер. Твоя серия становится ветром, который толкает тебя вперёд."],"Yorugʻ Minora":["Bright Tower","Светлая башня"],"Uzoqdan minora koʻrindi: u sen yigʻgan bilim va odatlardan qurilgan.":["A tower appeared in the distance: it is built from the knowledge and habits you have collected.","Вдали показалась башня: она построена из знаний и привычек, которые ты собрал."],"Intizom Choʻqqisi":["Peak of Discipline","Вершина дисциплины"],"Choʻqqi mukammallik emas, barqarorlikdir. Dam olish ham yoʻlning bir qismi.":["The peak is not perfection but stability. Rest is part of the journey too.","Вершина — это не совершенство, а стабильность. Отдых тоже часть пути."],"Hikoya":["Story","История"],"-bob ·":["-chapter ·","-я глава ·"],"Keyingi bob:":["Next chapter:","Следующая глава:"],"Barcha boblar ochilgan.":["All chapters are unlocked.","Все главы открыты."],"<svg class=\"radar\" viewBox=\"0 0 220 220\" role=\"img\" aria-label=\"Atributlar:":["<svg class=\"radar\" viewBox=\"0 0 220 220\" role=\"img\" aria-label=\"Attributes:","<svg class=\"radar\" viewBox=\"0 0 220 220\" role=\"img\" aria-label=\"Атрибуты:"],"Sayohatchi ·":["Traveler ·","Путник ·"],"EXP hamyon:":["EXP wallet:","Кошелёк EXP:"],"· keyingi level":["· next level","· следующий level"],"Level up mumkin":["Level up available","Level up доступен"],"Atributlar":["Attributes","Атрибуты"],"Boshlangʻich baho: oʻz-oʻzini baholash":["Initial assessment: self-assessment","Начальная оценка: самооценка"],"Bugungi EXP":["Today's EXP","EXP за сегодня"],"Seriya":["Streak","Серия"],"Jami EXP":["Total EXP","Всего EXP"],"Tizim kuni":["System day","День системы"],"Bugungi vazifalar":["Today's tasks","Задачи на сегодня"],"Vazifalarni ochish":["Open tasks","Открыть задачи"],"Intizom bosqichi (LV 20)":["Discipline stage (LV 20)","Этап дисциплины (LV 20)"],"Ochilgan":["Unlocked","Открыто"],"Qulflangan":["Locked","Закрыто"],"Level 20 da ochiladi: aniq uygʻonish, oʻqish, mashgʻulot, dam va uyqu vaqtlari. Mukammallik emas, barqarorlik. Sogʻliq va uyqu bu yerda ham birinchi oʻrinda. Hozir LV":["Unlocks at Level 20: exact wake-up, study, training, rest and sleep times. Not perfection, but stability. Health and sleep come first here too. Currently LV","Открывается на Level 20: точное время подъёма, учёбы, тренировки, отдыха и сна. Не совершенство, а стабильность. Здоровье и сон и здесь на первом месте. Сейчас LV"],"Yutuqlar":["Achievements","Достижения"],"coin ·":["coin ·","coin ·"],"Sozlamalar":["Settings","Настройки"],"Hisobingda saqlanyapti":["Saving to your account","Сохраняется в твоём аккаунте"],"Faqat shu brauzerda":["Only in this browser","Только в этом браузере"],"Ism":["Name","Имя"],"Avatar rasm":["Avatar image","Изображение аватара"],"Rasm tanlash":["Choose image","Выбрать изображение"],"Olib tashlash":["Remove","Убрать"],"Til":["Language","Язык"],"Interfeys yadrosi (menyu, baholash) 11 tilda. Vazifa, doʻkon va maslahat matnlari hozircha Oʻzbekcha.":["The interface core (menu, assessment) is available in 11 languages. Task, shop and tip texts are in Uzbek for now.","Основа интерфейса (меню, оценка) доступна на 11 языках. Тексты заданий, магазина и советов пока на узбекском."],"Qayta baholash":["Reassessment","Повторная оценка"],"Qayta baholash (20 savol)":["Reassessment (20 questions)","Повторная оценка (20 вопросов)"],"Level, EXP, coin va hamma narsa oʻchadi. Rostdan ham?":["Level, EXP, coins and everything else will be erased. Really?","Level, EXP, монеты и всё остальное сотрётся. Точно?"],"Ha, nolga qaytar":["Yes, reset to zero","Да, сбросить в ноль"],"Hammasini nolga qaytarish":["Reset everything to zero","Сбросить всё в ноль"],"Bugun":["Today","Сегодня"],"Kun":["Day","День"],"\" aria-label=\"Oʻchirish:":["\" aria-label=\"Delete:","\" aria-label=\"Удалить:"],"Tiklanish":["Recovery","Восстановление"],"\">Extra Trainingga oʻt":["\">Go to Extra Training","\">Перейти в Extra Training"],"Hozirgi vazifa ·":["Current task ·","Текущая задача ·"],"\">Bajardim":["\">Done","\">Готово"],"Hammasi tayyor":["All done","Всё готово"],"Bugungi vazifalar bajarildi":["Today's tasks are completed","Задачи на сегодня выполнены"],"EXP ni Level yoki Skillga sarflash uchun EXP oynasiga oʻt. Dam ol, tiklan.":["Go to the EXP window to spend EXP on Level or Skills. Rest and recover.","Перейди в окно EXP, чтобы потратить EXP на Level или Skills. Отдохни и восстановись."],"EXP ni sarflash":["Spend EXP","Потратить EXP"],"Yangi vazifa qoʻshish":["Add a new task","Добавить новую задачу"],"Nomi":["Title","Название"],"\" placeholder=\"Masalan: Kitob oʻqish\">":["\" placeholder=\"For example: Read a book\">","\" placeholder=\"Например: Читать книгу\">"],"Boshlanishi":["Start","Начало"],"Tugashi":["End","Конец"],"Atribut":["Attribute","Атрибут"],"Qoʻshish":["Add","Добавить"],"Hamma oʻzgarishlar oʻchadi.":["All changes will be erased.","Все изменения будут удалены."],"Ha, tikla":["Yes, restore","Да, восстановить"],"Standart rejaga qaytish":["Return to the default plan","Вернуться к стандартному плану"],"<button class=\"btn sm\" data-act=\"dayPrev\" aria-label=\"Oldingi kun\"":["<button class=\"btn sm\" data-act=\"dayPrev\" aria-label=\"Previous day\"","<button class=\"btn sm\" data-act=\"dayPrev\" aria-label=\"Предыдущий день\""],"· dam kuni":["· rest day","· день отдыха"],"<button class=\"btn sm\" data-act=\"dayNext\" aria-label=\"Keyingi kun\"":["<button class=\"btn sm\" data-act=\"dayNext\" aria-label=\"Next day\"","<button class=\"btn sm\" data-act=\"dayNext\" aria-label=\"Следующий день\""],"Bugunga qaytish":["Back to today","Вернуться к сегодняшнему дню"],"Ertangi kun faqat koʻrish uchun. Vazifalar shu kuni belgilanadi.":["Tomorrow is view-only. Tasks are marked on that day.","Завтрашний день только для п const TR={map:new Map(),re:null,cache:new Map(),obs:null,busy:false,orig:new WeakMap(),oattr:new WeakMap()};
(function(){
 const keys=Object.keys(TRD);
 keys.forEach(k=>TR.map.set(k,TRD[k]));
 const B1="(?<![\\p{L}\\p{N}ʻ'’‘])",B2="(?![\\p{L}\\p{N}ʻ’‘'])";
 const frag=keys.filter(k=>k.length>=3&&/\p{L}/u.test(k)).sort((a,b)=>b.length-a.length)
  .map(k=>(/^[\p{L}\p{N}]/u.test(k)?B1:"")+k.replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")+(/[\p{L}\p{N}]$/u.test(k)?B2:""));
 TR.re=frag.length?new RegExp(frag.join("|"),"gu"):null;
})();
function trText(s,lang){
 if(lang!=="en"&&lang!=="ru")return s;
 const ck=lang+"\u0001"+s;const c=TR.cache.get(ck);if(c!==undefined)return c;
 const idx=lang==="en"?0:1;
 const m=s.match(/^(\s*)([\s\S]*?)(\s*)$/);const core=m[2];
 let out=s;
 if(core){
  const e=TR.map.get(core);
  if(e)out=m[1]+e[idx]+m[3];
  else if(TR.re)out=s.replace(TR.re,x=>{const r=TR.map.get(x);return r?r[idx]:x});
 }
 if(TR.cache.size>6000)TR.cache.clear();
 TR.cache.set(ck,out);return out;
}
const TR_ATTR=["placeholder","title","aria-label","alt"];
function trNode(n,lang){
 if(n.nodeType===3){
  const p=n.parentNode;if(p&&(p.nodeName==="SCRIPT"||p.nodeName==="STYLE"))return;
  let o=TR.orig.get(n);
  if(!o||n.data!==o.out){o={src:n.data,out:n.data};}
  const out=trText(o.src,lang);o.out=out;TR.orig.set(n,o);
  if(n.data!==out)n.data=out;
 }else if(n.nodeType===1){
  if(n.nodeName==="SCRIPT"||n.nodeName==="STYLE")return;
  for(const a of TR_ATTR){
   if(!n.hasAttribute(a))continue;
   let m=TR.oattr.get(n);if(!m){m={};TR.oattr.set(n,m)}
   let o=m[a];const cur=n.getAttribute(a);
   if(!o||cur!==o.out)o={src:cur,out:cur};
   const out=trText(o.src,lang);o.out=out;m[a]=o;
   if(cur!==out)n.setAttribute(a,out);
  }
  for(let c=n.firstChild;c;c=c.nextSibling)trNode(c,lang);
 }
}
function trAll(){
 const lang=(S&&S.lang)||"uz";
 TR.busy=true;
 try{trNode(document.body,lang);document.title=lang==="uz"?"LVLORA":"LVLORA"}finally{TR.busy=false}
}
function trStart(){
 if(TR.obs||!window.MutationObserver)return;
 TR.obs=new MutationObserver(ms=>{
  if(TR.busy)return;
  const lang=(S&&S.lang)||"uz";
  TR.busy=true;
  try{for(const m of ms){
   if(m.type==="childList")m.addedNodes.forEach(n=>trNode(n,lang));
   else if(m.type==="characterData")trNode(m.target,lang);
   else if(m.type==="attributes")trNode(m.target,lang);
  }}finally{TR.busy=false}
 });
 TR.obs.observe(document.body,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:TR_ATTR});
 trAll();
}

trStart();
boot();
